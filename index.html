<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routinery — Daily Routine Builder</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="app">

  <header class="topbar">
    <h1 id="topbarTitle">Routines</h1>
    <button id="signOutBtn" class="icon-btn hidden" title="Sign out">⎋</button>
  </header>

  <main id="views">

    <!-- AUTH VIEW -->
    <section id="view-auth" class="view">
      <div class="auth-card">
        <h2>Sign in</h2>
        <p class="auth-hint">We'll email you a magic link — no password needed.</p>
        <label>Email</label>
        <input id="authEmailInput" type="email" placeholder="you@example.com">
        <button id="authSendBtn" class="primary-btn">Send Magic Link</button>
        <p id="authStatus" class="auth-status"></p>
      </div>
    </section>

    <!-- ROUTINES LIST VIEW -->
    <section id="view-routines" class="view">
      <div id="routineList" class="routine-list"></div>
      <p id="emptyState" class="empty-state">No routines yet. Tap + to build your first routine — morning, night, workout, study, anything.</p>
      <button id="addRoutineBtn" class="fab" title="New routine">+</button>
    </section>

    <!-- ROUTINE EDITOR VIEW -->
    <section id="view-editor" class="view">
      <div class="editor-header">
        <button class="icon-btn back-btn" data-back="view-routines">&larr;</button>
        <input id="routineNameInput" class="routine-name-input" placeholder="Routine name" maxlength="60">
        <button id="deleteRoutineBtn" class="icon-btn danger" title="Delete routine">🗑</button>
      </div>

      <div class="icon-row">
        <div class="icon-picker" id="iconPicker"></div>
      </div>

      <div id="stepList" class="step-list"></div>
      <button id="addStepBtn" class="secondary-btn">+ Add Step</button>
      <p id="editorTotalTime" class="total-time"></p>
      <button id="startRoutineBtn" class="primary-btn">Start Routine</button>
    </section>

    <!-- SESSION / RUN VIEW -->
    <section id="view-session" class="view">
      <div class="session-header">
        <button class="icon-btn" id="endSessionBtn" title="End routine">✕</button>
        <span id="sessionElapsed" class="session-timer">00:00</span>
        <button class="icon-btn" id="pauseSessionBtn" title="Pause">⏸</button>
      </div>

      <div class="session-body">
        <p class="session-progress" id="sessionProgress"></p>
        <div class="step-icon" id="sessionStepIcon">⏱</div>
        <h2 id="sessionStepName">Step</h2>

        <div class="progress-ring-wrap">
          <svg viewBox="0 0 120 120" class="progress-ring">
            <circle cx="60" cy="60" r="54" class="ring-bg"></circle>
            <circle cx="60" cy="60" r="54" class="ring-fg" id="ringFg"></circle>
          </svg>
          <div class="step-countdown" id="stepCountdown">00:00</div>
        </div>

        <div id="checklistControls" class="checklist-controls hidden">
          <p class="checklist-hint">Mark this step done when you're ready</p>
          <button id="completeStepBtn" class="primary-btn">Mark Done</button>
        </div>
      </div>

      <div class="session-footer">
        <button id="prevStepBtn" class="icon-btn">‹ Prev</button>
        <button id="skipStepBtn" class="icon-btn">Skip ›</button>
      </div>
    </section>

    <!-- SESSION SUMMARY VIEW -->
    <section id="view-summary" class="view">
      <div class="summary-card">
        <h2>Routine Complete 🎉</h2>
        <p id="summaryDuration"></p>
        <p id="summarySteps"></p>
        <button id="summaryDoneBtn" class="primary-btn">Done</button>
      </div>
    </section>

  </main>

  <!-- ADD/EDIT STEP MODAL -->
  <div id="stepModal" class="modal hidden">
    <div class="modal-content">
      <h3>Step</h3>
      <label>Name</label>
      <input id="stepNameInput" type="text" placeholder="e.g. Meditate, Stretch, Journal">

      <label>Type</label>
      <div class="segmented" id="stepTypeSegmented">
        <button type="button" data-type="timer" class="seg-btn active">Timer</button>
        <button type="button" data-type="checklist" class="seg-btn">Checklist (no timer)</button>
      </div>

      <div id="stepDurationGroup">
        <label>Duration</label>
        <div class="duration-row">
          <input id="stepMinInput" type="number" min="0" step="1" value="1"><span>min</span>
          <input id="stepSecInput" type="number" min="0" max="59" step="1" value="0"><span>sec</span>
        </div>
      </div>

      <div class="modal-actions">
        <button id="stepCancelBtn" class="secondary-btn">Cancel</button>
        <button id="stepSaveBtn" class="primary-btn">Save</button>
      </div>
    </div>
  </div>

</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
